name: Security Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  composer-audit:
    name: Composer Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP
        uses: shivammathur/setup-php@9e72090525849c5a82e9b5ae72f7bcdbd85f0a16 # v2.32.0
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Install dependencies (including dev)
        run: composer install --no-progress --prefer-dist

      - name: Run composer audit
        run: composer audit
        continue-on-error: false

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.104.0@sha256:84c827b45f8b1de57cb56ddcd3b7b3cd6cb0093c9600a4e93e4cf36fbc36bd39
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Semgrep
        run: |
          semgrep --config=auto \
            --config=p/php \
            --config=p/security-audit \
            --error \
            --sarif > semgrep.sarif 2>&1 || true
        continue-on-error: true

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@f09c1c0a94de965c15400f5634aa42fac8fb8f88 # v3.27.5
        with:
          sarif_file: semgrep.sarif
          category: semgrep
        continue-on-error: true

  secrets-scan:
    name: Secrets Scan (truffleHog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: TruffleHog secrets scan
        uses: trufflesecurity/trufflehog@f472773ed0f5e022b12c243c1e3533478caac5b8 # v3.88.0
        with:
          extra_args: --only-verified --results=verified,unknown